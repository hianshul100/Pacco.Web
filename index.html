    <link rel="icon" type="image/png" href="/favicon.png" />

      Runtime configuration is INJECTED, not embedded in the bundle, per
      ADR-008 (configuration is injected, not embedded). This file is served

    -->

    <title>Pacco</title>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
